# The complete compose for the Coolify service "mail" (project mail), as
# stored in Coolify's editor, plus the mail-provisioner sidecar. Paste the
# whole file into Coolify → mail → Edit Compose File. The sidecar's source
# lives beside the compose on the VPS, in ./provisioner (copied from
# ops/mail-provisioner/*.mjs); Coolify keeps that folder across redeploys.
services:
  mailserver:
    image: 'mailserver/docker-mailserver:latest'
    hostname: mail.spibermed.com
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      - '25:25'
      - '143:143'
      - '465:465'
      - '587:587'
      - '993:993'
    volumes:
      - 'dms-mail-data:/var/mail'
      - 'dms-mail-state:/var/mail-state'
      - 'dms-mail-logs:/var/log/mail'
      - 'dms-config:/tmp/docker-mailserver'
      - '/data/coolify/proxy/acme.json:/etc/letsencrypt/acme.json:ro'
      - '/etc/localtime:/etc/localtime:ro'
    environment:
      - OVERRIDE_HOSTNAME=mail.spibermed.com
      - SSL_TYPE=letsencrypt
      - SSL_DOMAIN=mail.spibermed.com
      - POSTMASTER_ADDRESS=postmaster@spibermed.com
      - PERMIT_DOCKER=connected-networks
      - ENABLE_CLAMAV=0
      - ENABLE_AMAVIS=0
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_OPENDKIM=0
      - ENABLE_OPENDMARC=0
      - ENABLE_POLICYD_SPF=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_RSPAMD=1
      - POSTFIX_MESSAGE_SIZE_LIMIT=52428800
      - RELAY_HOST=smtp-relay.brevo.com
      - RELAY_PORT=587
      - 'RELAY_USER=${BREVO_SMTP_LOGIN}'
      - 'RELAY_PASSWORD=${BREVO_SMTP_KEY}'
    networks:
      default:
        aliases:
          - mail.spibermed.com
  roundcube:
    image: 'roundcube/roundcubemail:latest-apache'
    restart: unless-stopped
    depends_on:
      - mailserver
    environment:
      - SERVICE_FQDN_ROUNDCUBE_80
      - 'ROUNDCUBEMAIL_DEFAULT_HOST=tls://mail.spibermed.com'
      - ROUNDCUBEMAIL_DEFAULT_PORT=143
      - 'ROUNDCUBEMAIL_SMTP_SERVER=tls://mail.spibermed.com'
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      - 'ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,managesieve'
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=25M
    volumes:
      - 'roundcube-db:/var/roundcube/db'
      - 'roundcube-config:/var/roundcube/config'
  mail-provisioner:
    image: 'node:22-alpine'
    restart: unless-stopped
    command: ['node', '/app/server.mjs']
    environment:
      - 'PROVISIONER_SECRET=${MAIL_PROVISIONER_SECRET}'
      - DMS_CONFIG_DIR=/tmp/docker-mailserver
      - MAIL_DOMAIN=spibermed.com
      - PORT=8025
    volumes:
      - 'dms-config:/tmp/docker-mailserver'
      - './provisioner:/app:ro'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8025/health']
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  dms-mail-data: null
  dms-mail-state: null
  dms-mail-logs: null
  dms-config: null
  roundcube-db: null
  roundcube-config: null
